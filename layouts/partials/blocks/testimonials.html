<section class="testimonials" aria-labelledby="testimonials-title">
  <div class="testimonials__inner">
    <div class="section-header">
      <div class="eyebrow">Historical testimonials</div>
      <h2 id="testimonials-title">What the community <em>said about CodeWeekend.</em></h2>
    </div>
    <ul class="testimonials__grid">
      {{ range site.Data.testimonials }}
      <li>
        <blockquote>&ldquo;{{ .quote }}&rdquo;</blockquote>
        <p><strong>{{ .name }}</strong><span>{{ .location }}</span></p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>

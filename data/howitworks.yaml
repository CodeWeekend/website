- num: "01"
  title: "Foundations"
  body: "Computer basics, the internet, Git, and the essential digital tools every developer relies on. We start with what you need, not what looks impressive on a syllabus."
  meta: "Weeks 1–3"
- num: "02"
  title: "Frontend & AI"
  body: "HTML, CSS, JavaScript, responsive design, and the React framework. Then a deep look at how to integrate large language models into web applications in practical, useful ways."
  meta: "Weeks 4–10"
- num: "03"
  title: "Capstone & Demo Day"
  body: "Each student designs and develops their own application, presented at a Demo Day to celebrate their progress. Real projects, real audiences, real portfolios."
  meta: "Weeks 11–12"

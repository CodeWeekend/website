{{ define "main" }}
<section class="notfound">
  <div class="notfound__inner">
    <img class="notfound__kite" src="{{ "brand/mark-full.svg" | relURL }}" alt="" width="92" height="130" />
    <div class="eyebrow alt">404 · Page not found</div>
    <h1>We can&rsquo;t find <em>this page.</em></h1>
    <p class="lead">The link may be broken, or the page may have moved. These pages are a good place to start.</p>
    <div class="notfound__actions">
      <a href="{{ "/" | relURL }}" class="btn btn--primary">Back to home</a>
      <a href="{{ "/programs/" | relURL }}" class="btn btn--secondary">See our programs</a>
    </div>
  </div>
</section>
{{ end }}

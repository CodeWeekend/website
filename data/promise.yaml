- title: "Live instruction, every session."
  body: "No pre-recorded videos, no asynchronous-only modules. Every class is taught live by a working developer."
- title: "A cohort that goes through it with you."
  body: "You are never learning alone. Pair programming, peer code reviews, and a community that does not go quiet after graduation."
- title: "Mentorship from people who ship."
  body: "Cohorts are staffed by working engineers and dedicated female mentors from Afghanistan and abroad. They share their professional experiences and answer the questions only practice can produce."
- title: "Free for participants."
  body: "Through partnerships with the Linda Norgrove Foundation, Hackajob, Scrimba, and others, the program is free for those accepted — including scholarships, internet packages, and laptops where needed."

- title: "A real teacher, live, every session."
  icon: "clock"
  body: "No pre-recorded videos to sit through alone. Every session is taught live by a working developer, so you can ask your question the moment it comes up."
- title: "You will never learn alone."
  icon: "users"
  body: "Pair programming, peer code reviews, and a cohort that goes through every week with you — then a community that stays long after graduation."
- title: "Mentors in your corner."
  icon: "user-check"
  body: "Working engineers and dedicated female mentors from Afghanistan and abroad share their professional journeys and answer the questions only practice can produce."
- title: "Free, so cost never decides."
  icon: "heart"
  body: "Every Bootcamp is free for those accepted. Partners such as the Linda Norgrove Foundation and GiveInternet help with scholarships, internet packages, and laptops where needed."

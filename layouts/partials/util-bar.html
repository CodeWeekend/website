<div class="util-bar">
  <div class="util-bar__inner">
    <span class="lang-switch" aria-label="Language switcher">
      <button type="button" data-lang="en" aria-label="Switch to English">EN</button><span aria-hidden="true">·</span>
      <button type="button" data-lang="fa" aria-label="Switch to Dari" lang="fa">دری</button><span aria-hidden="true">·</span>
      <button type="button" data-lang="ps" aria-label="Switch to Pashto" lang="ps">پښتو</button>
    </span>
    <a href="{{ "/get-involved/donate/" | relURL }}" class="util-link">Donate</a>
    <a href="{{ "/get-involved/mentor/" | relURL }}" class="util-link">Mentor</a>
    <a href="{{ .Site.Params.applyFormUrl | default "/get-involved/" }}" class="util-cta" target="_blank" rel="noopener noreferrer">Apply for the next cohort</a>
  </div>
</div>

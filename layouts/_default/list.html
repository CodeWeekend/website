{{ define "main" }}
<header class="page-header">
  <div class="page-header__inner">
    <div class="crumb"><a href="{{ "/" | relURL }}">Home</a> &middot; {{ .Title }}</div>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead page-header__lead">{{ . }}</p>{{ end }}
  </div>
</header>

{{ with .Content }}
<article class="prose">{{ . }}</article>
{{ end }}

<section class="list-grid">
  <div class="list-grid__inner">
    <ul class="page-list">
      {{ range .Pages.ByDate.Reverse }}
        <li class="page-list__item">
          <a class="page-list__title" href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Description }}<p class="page-list__desc">{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}

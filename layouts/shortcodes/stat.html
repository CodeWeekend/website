{{- /* Inline stat shortcode. Usage: {{< stat number="92" suffix="%" label="placement rate" >}} */ -}}
<span class="inline-stat" style="display: inline-flex; align-items: baseline; gap: 6px; padding: 0 4px;">
  <strong style="font-family: var(--cw-font); font-size: 1.4em; color: var(--cw-ink); font-weight: 800; letter-spacing: -0.02em;">{{ .Get "number" }}{{ .Get "suffix" }}</strong>
  <span style="font-size: 0.92em; color: var(--cw-muted);">{{ .Get "label" }}</span>
</span>

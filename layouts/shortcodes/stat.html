{{- /* Inline stat shortcode. Usage: {{< stat number="92" suffix="%" label="placement rate" >}} */ -}}
<span class="inline-stat" style="display: inline-flex; align-items: baseline; gap: 6px; padding: 0 4px;">
  <strong style="font-family: var(--font-display); font-size: 1.4em; line-height: 1; letter-spacing: -0.02em; color: var(--lapis-600); font-weight: 800;">{{ .Get "number" }}{{ .Get "suffix" }}</strong>
  <span style="font-size: 0.92em; color: var(--ink-2);">{{ .Get "label" }}</span>
</span>

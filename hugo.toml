[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[imaging]
  quality = 85
  resampleFilter = "lanczos"

[security.funcs]
  getenv = ["^HUGO_", "^CI$"]

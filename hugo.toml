baseURL = "https://codeweekend.net/"
languageCode = "en-us"
title = "CodeWeekend"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "An inclusive community of developers. Free, fully-live coding bootcamps for Afghan youth — with the 2026 cohort dedicated to women and girls in Afghanistan."
  tagline = "An inclusive community of developers."
  authorName = "CodeWeekend"
  ogImage = "/images/og-default.jpg"
  applyFormUrl = "/get-involved/apply/"
  mentorFormUrl = "/get-involved/mentor/"
  hireFormUrl = "/get-involved/hire/"
  donateUrl = "/get-involved/donate/"
  contactEmail = "hello@codeweekend.net"

  [params.social]
    instagram = "https://instagram.com/codeweekend"
    facebook = "https://facebook.com/codeweekend"
    x = "https://x.com/codeweekend"
    linkedin = "https://linkedin.com/school/codeweekend"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083B5A"/>
      <stop offset="100%" stop-color="#0C4F73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1AAEDC"/>
      <stop offset="100%" stop-color="#4ABBE2"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- soft ambient circles -->
  <circle cx="700" cy="120" r="220" fill="rgba(26,174,220,0.10)"/>
  <circle cx="100" cy="900" r="280" fill="rgba(231,111,81,0.08)"/>
  <circle cx="600" cy="700" r="120" fill="rgba(26,174,220,0.06)"/>

  <!-- decorative grid -->
  <g opacity="0.06" stroke="white" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- editor / code window -->
  <g transform="translate(120 280)">
    <rect width="560" height="440" rx="16" fill="#0E1F2C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="32" cy="32" r="6" fill="#E76F51"/>
    <circle cx="54" cy="32" r="6" fill="#F4A261"/>
    <circle cx="76" cy="32" r="6" fill="#1AAEDC"/>
    <!-- file tab -->
    <rect x="120" y="20" width="160" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="138" y="37" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9CA3AF">App.jsx</text>

    <!-- code lines -->
    <g font-family="'JetBrains Mono', monospace" font-size="15" fill="white">
      <text x="32" y="100" fill="#6B7280">1</text>
      <text x="68" y="100" fill="#7DD3FC">import</text>
      <text x="140" y="100" fill="white">React</text>
      <text x="200" y="100" fill="#7DD3FC">from</text>
      <text x="252" y="100" fill="#FCD34D">'react'</text>

      <text x="32" y="130" fill="#6B7280">2</text>

      <text x="32" y="160" fill="#6B7280">3</text>
      <text x="68" y="160" fill="#7DD3FC">function</text>
      <text x="160" y="160" fill="#C4B5FD">Welcome</text>
      <text x="245" y="160" fill="white">() {</text>

      <text x="32" y="190" fill="#6B7280">4</text>
      <text x="92" y="190" fill="#7DD3FC">return</text>
      <text x="160" y="190" fill="white">(</text>

      <text x="32" y="220" fill="#6B7280">5</text>
      <text x="116" y="220" fill="#9CA3AF">&lt;h1&gt;</text>
      <text x="172" y="220" fill="white">Hello, world.</text>
      <text x="332" y="220" fill="#9CA3AF">&lt;/h1&gt;</text>

      <text x="32" y="250" fill="#6B7280">6</text>
      <text x="92" y="250" fill="white">)</text>

      <text x="32" y="280" fill="#6B7280">7</text>
      <text x="68" y="280" fill="white">}</text>

      <text x="32" y="310" fill="#6B7280">8</text>

      <text x="32" y="340" fill="#6B7280">9</text>
      <text x="68" y="340" fill="#7DD3FC">export</text>
      <text x="140" y="340" fill="#7DD3FC">default</text>
      <text x="222" y="340" fill="#C4B5FD">Welcome</text>
      <text x="316" y="340" fill="white">;</text>

      <!-- cursor -->
      <rect x="318" y="328" width="3" height="18" fill="#1AAEDC">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- terminal output -->
    <g transform="translate(0 360)">
      <line x1="32" y1="0" x2="528" y2="0" stroke="rgba(255,255,255,0.08)"/>
      <text x="32" y="32" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10B981">→ Compiled successfully.</text>
      <text x="32" y="56" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9CA3AF">→ Local: http://localhost:3000</text>
    </g>
  </g>

  <!-- big bracket frame -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 60 60 L 30 60 L 30 940 L 60 940"/>
    <path d="M 740 60 L 770 60 L 770 940 L 740 940"/>
  </g>

  <!-- caption / brand -->
  <g transform="translate(60 100)">
    <text font-family="'JetBrains Mono', monospace" font-size="14" fill="#1AAEDC" letter-spacing="3">// COHORT 2026</text>
  </g>

  <g transform="translate(60 880)">
    <text font-family="'Fraunces', serif" font-size="28" font-weight="400" font-style="italic" fill="white">A bootcamp for women</text>
    <text y="34" font-family="'Fraunces', serif" font-size="28" font-weight="400" font-style="italic" fill="#84D2EF">and girls in Afghanistan.</text>
  </g>
</svg>

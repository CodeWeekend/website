{{- /* Inline stat shortcode. Usage: {{< stat number="92" suffix="%" label="placement rate" >}} */ -}}
<span class="inline-stat" style="display: inline-flex; align-items: baseline; gap: 6px; padding: 0 4px;">
  <strong style="font-family: var(--serif); font-size: 1.4em; color: var(--sky-700); font-weight: 500;">{{ .Get "number" }}{{ .Get "suffix" }}</strong>
  <span style="font-size: 0.92em; color: var(--slate-600);">{{ .Get "label" }}</span>
</span>

<ul class="team-grid">
  {{- range site.Data.team }}
  {{- $words := split .name " " }}
  {{- $initials := printf "%s%s" (substr (index $words 0) 0 1) (substr (index $words (sub (len $words) 1)) 0 1) }}
  <li class="team-card{{ with .bio }} team-card--lead{{ end }}">
    <span class="team-card__avatar" aria-hidden="true">{{ $initials }}</span>
    <div class="team-card__body">
      <h3 class="team-card__name">{{ .name }}</h3>
      <p class="team-card__role">{{ .role }}</p>
      {{- with .bio }}
      <p class="team-card__bio">{{ . }}</p>
      {{- end }}
    </div>
  </li>
  {{- end }}
</ul>

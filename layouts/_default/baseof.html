<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ with .Params.body_class }} class="{{ . }}"{{ end }}>
  {{ partial "util-bar.html" . }}
  {{ partial "nav.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ $main := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $main.RelPermalink }}" integrity="{{ $main.Data.Integrity }}" defer></script>
</body>
</html>
